[package]
name = "heuresis"
version = "0.1.2"
description = "Heuresis desktop learning environment"
authors = ["Thomas"]
edition = "2021"

[lib]
name = "heuresis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native desktop-wide Capture shortcut. Unsupported on Android and iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.0"
