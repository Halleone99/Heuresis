[package]
name = "heuresis"
version = "0.1.0"
description = "Heuresis desktop learning environment"
authors = ["Thomas"]
edition = "2021"

[lib]
name = "heuresis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
