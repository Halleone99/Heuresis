<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e7" />
    <title>Heuresis</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f4f0e7;
      }

      .heuresis-boot {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.76), transparent 34%),
          linear-gradient(180deg, #f7f3eb 0%, #f1ece2 100%);
        color: #211d19;
        font-family: Georgia, "Times New Roman", serif;
      }

      .heuresis-boot::before {
        content: "";
        position: absolute;
        width: min(520px, 78vw);
        height: min(520px, 78vw);
        border-radius: 50%;
        border: 1px solid rgba(169, 133, 82, 0.08);
        box-shadow:
          0 0 0 80px rgba(169, 133, 82, 0.025),
          0 0 0 160px rgba(169, 133, 82, 0.018);
        pointer-events: none;
      }

      .heuresis-boot-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 17px;
        transform: translateY(-2vh);
        text-align: center;
      }

      .heuresis-boot-mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background:
          radial-gradient(circle at 34% 24%, rgba(255, 255, 255, 0.08), transparent 34%),
          linear-gradient(145deg, #4f4b40 0%, #37342e 58%, #2c2925 100%);
        color: #ead9b8;
        box-shadow:
          inset 0 0 0 1px rgba(215, 190, 145, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 14px 34px rgba(48, 42, 35, 0.15);
        font-size: 32px;
        line-height: 1;
        letter-spacing: -0.08em;
        text-indent: -0.08em;
      }

      .heuresis-boot-name {
        font-size: 34px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .heuresis-boot-name span {
        color: #a98552;
      }

      .heuresis-boot-status {
        min-width: 170px;
        color: #8f877b;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .heuresis-boot-dots {
        display: inline-flex;
        gap: 5px;
        margin-top: 2px;
      }

      .heuresis-boot-dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #a98552;
        opacity: 0.25;
        animation: heuresis-boot-pulse 1.25s ease-in-out infinite;
      }

      .heuresis-boot-dots i:nth-child(2) {
        animation-delay: 0.14s;
      }

      .heuresis-boot-dots i:nth-child(3) {
        animation-delay: 0.28s;
      }

      @keyframes heuresis-boot-pulse {
        0%,
        70%,
        100% {
          opacity: 0.2;
          transform: translateY(0);
        }
        35% {
          opacity: 0.9;
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .heuresis-boot-dots i {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="heuresis-boot" role="status" aria-live="polite" aria-label="Heuresis is opening">
        <div class="heuresis-boot-inner">
          <div class="heuresis-boot-mark" aria-hidden="true">H</div>
          <div class="heuresis-boot-name">Heure<span>sis</span></div>
          <div class="heuresis-boot-status">Preparing your library</div>
          <div class="heuresis-boot-dots" aria-hidden="true">
            <i></i><i></i><i></i>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
