<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2733" />
    <title>Heuresis</title>
    <script>
      // Resolve appearance before React mounts (including Capture and Review popups).
      (() => {
        try {
          const storedMode = localStorage.getItem("heuresis.theme.v1");
          const mode = storedMode === "light" || storedMode === "dark" ? storedMode : "system";
          const paletteKey = "heuresis.palette.v1";
          const upgradeKey = "heuresis.appearance.blue.v1";
          const saved = localStorage.getItem(paletteKey);
          let palette = ["slate", "forest", "sepia", "neutral"].includes(saved) ? saved : "slate";
          if (!localStorage.getItem(upgradeKey)) {
            if (!saved || saved === "sepia") {
              palette = "slate";
              localStorage.setItem(paletteKey, palette);
            }
            localStorage.setItem(upgradeKey, "1");
          }
          const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.palette = palette;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch { document.documentElement.dataset.palette = "slate"; }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--ws-page, #1f2733);
      }

      .heuresis-boot {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 44%, rgba(102,149,214,.17), transparent 40%), linear-gradient(140deg, #0d192a, #172940 63%, #0e1929);
        color: #edf3fa;
        font-family: Georgia, "Times New Roman", serif;
      }

      .heuresis-boot::before {
        content: "";
        position: absolute;
        width: min(520px, 78vw);
        height: min(520px, 78vw);
        border-radius: 50%;
        border: 1px solid rgba(131, 172, 221, 0.10);
        box-shadow:
          0 0 0 80px rgba(131, 172, 221, 0.035),
          0 0 0 160px rgba(131, 172, 221, 0.020);
        pointer-events: none;
      }

      .heuresis-boot-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 17px;
        transform: translateY(-2vh);
        text-align: center;
      }

      .heuresis-boot-mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background:
          radial-gradient(circle at 34% 24%, rgba(255, 255, 255, 0.08), transparent 34%),
          linear-gradient(145deg, #334f72 0%, #1c324e 58%, #142439 100%);
        color: #e4efff;
        box-shadow:
          inset 0 0 0 1px rgba(170, 204, 247, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 14px 34px rgba(2, 13, 32, 0.28);
        font-size: 32px;
        line-height: 1;
        letter-spacing: -0.08em;
        text-indent: -0.08em;
      }

      .heuresis-boot-name {
        font-size: 34px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .heuresis-boot-name span {
        color: #9abfe9;
      }

      .heuresis-boot-status {
        min-width: 170px;
        color: #a6b8cf;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .heuresis-boot-dots {
        display: inline-flex;
        gap: 5px;
        margin-top: 2px;
      }

      .heuresis-boot-dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #a7c7ee;
        opacity: 0.25;
        animation: heuresis-boot-pulse 1.25s ease-in-out infinite;
      }

      .heuresis-boot-dots i:nth-child(2) {
        animation-delay: 0.14s;
      }

      .heuresis-boot-dots i:nth-child(3) {
        animation-delay: 0.28s;
      }

      @keyframes heuresis-boot-pulse {
        0%,
        70%,
        100% {
          opacity: 0.2;
          transform: translateY(0);
        }
        35% {
          opacity: 0.9;
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .heuresis-boot-dots i {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="heuresis-boot" role="status" aria-live="polite" aria-label="Heuresis is opening">
        <div class="heuresis-boot-inner">
          <div class="heuresis-boot-mark" aria-hidden="true">H</div>
          <div class="heuresis-boot-name">Heure<span>sis</span></div>
          <div class="heuresis-boot-status">Preparing your library</div>
          <div class="heuresis-boot-dots" aria-hidden="true">
            <i></i><i></i><i></i>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
