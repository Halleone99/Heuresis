name: Apply topic filter v4

on:
  push:
    paths:
      - 'scripts/apply-topic-filter-v4.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply topic filter refinement
        run: node scripts/apply-topic-filter-v4.mjs
      - name: Commit refinement
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PackView.tsx src/topic-filter-popovers.css src/main.tsx
          git commit -m "Refine topic filters and connections control"
          git push
