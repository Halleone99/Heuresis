name: Heuresis Windows x64 Preview
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/tauri-windows-x64-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/tauri-windows-x64-preview.yml"
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Generate app icons
        run: npm run tauri icon src-tauri/heuresis-icon.svg
      - name: Install Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc
      - name: Build Windows x64 installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Heuresis-Reading-Preview-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
