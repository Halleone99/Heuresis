name: Check Heuresis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, review/claude-audit-2026-10-15]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/check-architecture.mjs
      - run: node scripts/check-capture-parse.mjs
      - run: node scripts/check-pinyin-unicode.mjs
      - run: node scripts/check-study-session-counts.mjs
      - run: node scripts/check-progress-tooltips.mjs
      - run: node scripts/check-progress-layout.mjs
      - run: node scripts/check-progress-languages.mjs
      - run: node scripts/check-mistake-journey.mjs
      - run: node scripts/check-progress-study-error.mjs
      - run: node scripts/check-notebook-consistency.mjs
      - run: node scripts/check-mistake-filter-row.mjs
      - run: node scripts/check-capture-to-flashcard.mjs
      - run: node scripts/check-study-flashcard-integration.mjs
      - run: node scripts/check-redesign-batch-a.mjs
      - run: node scripts/check-command-palette.mjs
      - run: node scripts/check-true-loading-states.mjs
      - run: node scripts/check-shell-accessibility.mjs
      - run: node scripts/check-navigation-polish.mjs
      - run: node scripts/check-lesson-cleanup.mjs
      - run: node scripts/check-native-quick-capture.mjs
      - run: node scripts/check-capture-context.mjs
      - run: node scripts/check-sort-review-flow.mjs
      - run: node scripts/check-workspace-noise.mjs
      - run: node scripts/check-workspace-signal.mjs
      - run: node scripts/check-notebook-controls.mjs
      - run: node --experimental-strip-types scripts/check-note-views.mjs
      - run: node scripts/check-notebook-sidebar.mjs
      - run: node scripts/check-reference-library.mjs
      - run: node scripts/check-reading-journal.mjs
      - run: node scripts/check-save-feedback.mjs
      - run: node scripts/check-rejected-capture-recovery.mjs
      - run: node scripts/check-chinese-reading.mjs
      - run: node scripts/check-accent-consistency.mjs
      - run: node scripts/check-overview-compact.mjs
      - run: node scripts/check-background-controls.mjs
      - run: node scripts/check-appearance.mjs
      - run: node scripts/check-languages.mjs
      - run: node scripts/check-palette-ranking.mjs
      - run: node scripts/check-offline-revision-chain.mjs
      - run: node scripts/check-study-workflow-polish.mjs
      - run: node scripts/check-final-clarity.mjs
      - run: node scripts/check-review-engine.mjs
      - run: node scripts/check-nonstudy-clarity.mjs
      - run: npm run build
      # Browser fixture tests the CSS actually computed for eight palette/mode pairs.
      # Test-only dependencies: no Playwright package added to the application.
      - name: Install browser for appearance smoke check
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check rendered appearance
        run: node scripts/check-rendered-appearance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heuresis-appearance-smoke
          path: test-output/appearance/*.png
          if-no-files-found: ignore
