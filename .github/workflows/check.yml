name: Check Heuresis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/check-architecture.mjs
      - run: node scripts/check-capture-parse.mjs
      - run: node scripts/check-pinyin-unicode.mjs
      - run: node scripts/check-study-session-counts.mjs
      - run: node scripts/check-progress-tooltips.mjs
      - run: node scripts/check-progress-layout.mjs
      - run: node scripts/check-lesson-cleanup.mjs
      - run: node scripts/check-sort-review-flow.mjs
      - run: node scripts/check-workspace-noise.mjs
      - run: node scripts/check-appearance.mjs
      - run: npm run build
      # Browser fixture tests the CSS actually computed for eight palette/mode pairs.
      # Test-only dependencies: no Playwright package added to the application.
      - name: Install browser for appearance smoke check
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check rendered appearance
        run: node scripts/check-rendered-appearance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heuresis-appearance-smoke
          path: test-output/appearance/*.png
          if-no-files-found: ignore
