name: Patch Heuresis create and edit UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make card creation and editing obvious
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/PackView.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import { ArrowLeft, ArrowUpDown, BookOpen, Brain, ChevronDown, Compass, FileUp, GitFork, Link2, Search, Settings2, SlidersHorizontal, Star } from "lucide-react";',
                  'import { ArrowLeft, ArrowUpDown, BookOpen, Brain, ChevronDown, Compass, FileUp, GitFork, Link2, Pencil, Plus, Search, Settings2, SlidersHorizontal, Star } from "lucide-react";'
              ),
              (
                  'export default function PackView({ pack, collection, onBack, onSettings, onChanged }: Props) {',
                  'export default function PackView({ pack, collection, onBack, onCapture, onSettings, onChanged }: Props) {'
              ),
              (
                  '          <button className="secondary-button" disabled={!cards.length} onClick={() => setBrowseOpen(true)}><Compass size={15} /> Browse</button>\n        </div>',
                  '          <button className="secondary-button" disabled={!cards.length} onClick={() => setBrowseOpen(true)}><Compass size={15} /> Browse</button>\n          <button className="secondary-button" onClick={onCapture}><Plus size={15} /> New card</button>\n        </div>'
              ),
              (
                  '      <div className="topic-selection-hint">{selectedCard ? <><strong>{fieldText(selectedCard.data, term?.key) || "Card"}</strong> selected · double-click or press Enter to edit</> : <>Click once to select · double-click to edit</>}</div>',
                  '      <div className="topic-selection-hint">{selectedCard ? <><strong>{fieldText(selectedCard.data, term?.key) || "Card"}</strong> selected · use Edit on the right</> : <>Select a card to reveal Edit · double-click still opens directly</>}</div>'
              ),
              (
                  '              <button className="row-connections-icon" onClick={(event) => { event.stopPropagation(); setConnectionsCard(card); }} onDoubleClick={(event) => event.stopPropagation()} title="Open connections tree" aria-label={`Open connections for ${fieldText(card.data, term?.key) || "card"}`}><GitFork size={15} /></button>',
                  '              <div className="row-mini-actions">\n                {selected ? <button onClick={(event) => { event.stopPropagation(); setEditing(card); }} onDoubleClick={(event) => event.stopPropagation()} title="Edit card"><Pencil size={13} /> Edit</button> : null}\n                <button className="row-connections-icon" onClick={(event) => { event.stopPropagation(); setConnectionsCard(card); }} onDoubleClick={(event) => event.stopPropagation()} title="Open connections tree" aria-label={`Open connections for ${fieldText(card.data, term?.key) || "card"}`}><GitFork size={15} /></button>\n              </div>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify frontend build
        run: npm run build

      - name: Commit UX changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PackView.tsx
          git diff --cached --check
          git commit -m "Make card creation and editing obvious"
          git push origin HEAD:main
