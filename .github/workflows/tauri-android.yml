name: Build Heuresis MagicPad Android APK

on:
  push:
    branches:
      - main
      - feature/magicpad-android
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/tauri-android.yml"
  workflow_dispatch:

jobs:
  android-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://qbxyiamrbqmdaubzcxpk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EyQguSeCT2BVi04m_DtlyA_9bcMp-R9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: heuresis-android-debug-signing-v1

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Resolve Android NDK
        shell: bash
        run: |
          NDK_PATH="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_PATH"

      - name: Initialise Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Enable immersive fullscreen, keyboard insets and PDF saving on Android
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find src-tauri/gen/android/app/src/main/java -type f -name 'MainActivity.kt' -print -quit)"
          test -n "$MAIN_ACTIVITY"
          PACKAGE_LINE="$(grep -m1 '^package ' "$MAIN_ACTIVITY")"
          test -n "$PACKAGE_LINE"
          cat > "$MAIN_ACTIVITY" <<EOF
          $PACKAGE_LINE

          import android.content.ContentValues
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import java.io.File

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              hideSystemBars()
              keepContentAboveKeyboard()
            }

            // The WebView has no download handler, so the Catalogue's "Export PDF" calls
            // window.HeuresisAndroidFiles.savePdf(name, base64) (src/lib/catalogue/save.ts).
            override fun onWebViewCreate(webView: WebView) {
              super.onWebViewCreate(webView)
              webView.addJavascriptInterface(HeuresisFiles(), "HeuresisAndroidFiles")
            }

            inner class HeuresisFiles {
              // Android 10+: Downloads/Heuresis through MediaStore (no storage permission needed).
              // Older Android: the app's own Documents/Heuresis folder.
              // Returns where the file went, or "error:" and a reason.
              @JavascriptInterface
              fun savePdf(name: String, base64: String): String {
                return try {
                  val bytes = Base64.decode(base64, Base64.DEFAULT)
                  val fileName = name.replace('/', ' ').trim().ifEmpty { "Heuresis.pdf" }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                      put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf")
                      put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Heuresis")
                    }
                    val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: return "error:Android did not create the file."
                    val stream = contentResolver.openOutputStream(uri) ?: return "error:Android did not open the file."
                    stream.use { it.write(bytes) }
                    "Downloads/Heuresis"
                  } else {
                    val folder = File(getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS), "Heuresis")
                    folder.mkdirs()
                    File(folder, fileName).writeBytes(bytes)
                    "the app's Documents/Heuresis folder"
                  }
                } catch (error: Exception) {
                  "error:" + (error.message ?: "unknown error")
                }
              }
            }

            // A full-screen (edge-to-edge) window is not resized for the on-screen keyboard,
            // so the keyboard covered Sort's quick note, typed Review answers and Capture.
            // Shrink the WebView by the keyboard's height instead. If a parent view already
            // applies the keyboard inset, it consumes it and this reads 0 (no double gap).
            private fun keepContentAboveKeyboard() {
              @Suppress("DEPRECATION")
              window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)
              val content = findViewById<View>(android.R.id.content)
              ViewCompat.setOnApplyWindowInsetsListener(content) { view, insets ->
                val keyboard = insets.getInsets(WindowInsetsCompat.Type.ime()).bottom
                view.setPadding(0, 0, 0, keyboard)
                insets
              }
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) hideSystemBars()
            }

            private fun hideSystemBars() {
              WindowCompat.setDecorFitsSystemWindows(window, false)
              WindowCompat.getInsetsController(window, window.decorView).apply {
                hide(WindowInsetsCompat.Type.systemBars())
                systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }
            }
          }
          EOF
          echo "Patched $MAIN_ACTIVITY for immersive fullscreen, the on-screen keyboard and PDF saving"

      - name: Type-check and build web app
        run: npm run build

      - name: Build signed debug APK for MagicPad ARM64
        run: npm run tauri android build -- --debug --apk --target aarch64 --ci

      - name: Show generated APKs
        shell: bash
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload MagicPad APK
        uses: actions/upload-artifact@v4
        with:
          name: heuresis-magicpad2-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90
