name: Build Heuresis MagicPad Android APK

on:
  push:
    branches:
      - main
      - feature/magicpad-android
  workflow_dispatch:

jobs:
  android-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://qbxyiamrbqmdaubzcxpk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EyQguSeCT2BVi04m_DtlyA_9bcMp-R9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: heuresis-android-debug-signing-v1

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Resolve Android NDK
        shell: bash
        run: |
          NDK_PATH="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_PATH"

      - name: Initialise Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Enable immersive fullscreen on Android
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find src-tauri/gen/android/app/src/main/java -type f -name 'MainActivity.kt' -print -quit)"
          test -n "$MAIN_ACTIVITY"
          PACKAGE_LINE="$(grep -m1 '^package ' "$MAIN_ACTIVITY")"
          test -n "$PACKAGE_LINE"
          cat > "$MAIN_ACTIVITY" <<EOF
          $PACKAGE_LINE

          import android.os.Bundle
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              hideSystemBars()
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) hideSystemBars()
            }

            private fun hideSystemBars() {
              WindowCompat.setDecorFitsSystemWindows(window, false)
              WindowCompat.getInsetsController(window, window.decorView).apply {
                hide(WindowInsetsCompat.Type.systemBars())
                systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }
            }
          }
          EOF
          echo "Patched $MAIN_ACTIVITY for immersive fullscreen"

      - name: Type-check and build web app
        run: npm run build

      - name: Build signed debug APK for MagicPad ARM64
        run: npm run tauri android build -- --debug --apk --target aarch64 --ci

      - name: Show generated APKs
        shell: bash
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload MagicPad APK
        uses: actions/upload-artifact@v4
        with:
          name: heuresis-magicpad2-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90
