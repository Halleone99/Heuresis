name: Build Heuresis Windows ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/tauri-windows.yml"

jobs:
  windows-arm64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://qbxyiamrbqmdaubzcxpk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EyQguSeCT2BVi04m_DtlyA_9bcMp-R9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-pc-windows-msvc

      - name: Build ARM64 installer
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: heuresis-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
