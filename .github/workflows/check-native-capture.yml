name: Check native Capture (Windows)

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/components/workspace/FloatingQuickCapture.tsx"
      - ".github/workflows/check-native-capture.yml"
  workflow_dispatch:

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Check Windows Tauri and global shortcut Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml
