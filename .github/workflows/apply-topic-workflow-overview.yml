name: Apply topic workflow overview

on:
  push:
    paths:
      - scripts/apply-topic-workflow-overview.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply overview patch
        run: node scripts/apply-topic-workflow-overview.mjs
      - name: Commit overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PackView.tsx
          git commit -m "Redesign topic workflow overview"
          git push
